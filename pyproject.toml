[project]
name = "template"
version = "0.1.0"
description = "Demo of the use of AI to build Dashboards"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "polars>=1.0",
    "duckdb>=1.1",
    "nbformat>=5.11.1",
    "altair>=6.3.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ipykernel>=6.29"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["criterio(id): criterio de aceptación que verifica el test (p. ej. CA3)"]
